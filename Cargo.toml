[workspace]
resolver = "3"
members = ["api/*", "svc/*", "app/*", "test/kit", "xtask"]
default-members = ["app/daemon", "app/cli", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["YavorGIvanov <yavorgenadiev@gmail.com>"]
license = "MIT"

[workspace.dependencies]
bytes = "=1.12.1"
getrandom = "=0.2.17"
hyper = { version = "=1.11.0", default-features = false, features = ["client", "http1", "server"] }
http-body-util = "=0.1.5"
hyper-util = { version = "=0.1.20", default-features = false, features = ["tokio"] }
libc = "0.2"
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = { version = "=0.7.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.23"
tokio = { version = "=1.53.1", default-features = false, features = ["io-util", "net", "rt", "time"] }
tokio-rustls = { version = "=0.26.4", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

[workspace.metadata.lao]
policy = 1

[workspace.metadata.lao.restricted]
lao-gate-api = ["lao-gate", "lao-daemon", "lao-test-kit"]
lao-capture-api = ["lao-capture", "lao-capture-worker", "lao-test-kit"]
lao-model-api = ["lao-model", "lao-daemon", "lao-test-kit"]
lao-optimize-api = ["lao-optimize", "lao-daemon", "lao-cli"]
lao-run-api = ["lao-run", "lao-daemon", "lao-gate", "lao-test-kit"]
lao-vault-api = ["lao-vault", "lao-vault-worker", "lao-test-kit"]
lao-train-api = ["lao-train", "lao-train-worker", "lao-test-kit"]
